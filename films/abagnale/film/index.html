<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Абигнейл</title>
<style>
  html, body { margin: 0; background: #14181F; overflow: hidden; }
  #stage { position: relative; width: 1080px; height: 1920px; background: #14181F; }
  #view { position: absolute; inset: 0; width: 1080px; height: 1920px; display: block; }
  #shade { position: absolute; left: 0; top: 0; width: 1080px; height: 640px; pointer-events: none;
    background: linear-gradient(#14181F 0%, #14181F 42%, transparent 100%); }
  #type { position: absolute; inset: 0; pointer-events: none; }
  .hook, .sub, .term {
    position: absolute; color: #F2F4F7; font-family: Unbounded, sans-serif;
    font-weight: 700; letter-spacing: -0.02em; line-height: 0.92; margin: 0;
  }
  .sub { text-align: center; width: 960px; left: 60px; top: 1424px; white-space: nowrap; }
  .accent { color: #FF9340; }
  #foot { position: absolute; left: 0; top: 1388px; width: 1080px; height: 532px; background: #14181F; pointer-events: none; }
  .hud {
    position: absolute; left: 72px; top: 620px; color: #8E99A8;
    font-family: Plex, monospace; font-weight: 500; font-size: 28px;
    letter-spacing: 0.2em; line-height: 1;
  }
  .gap {
    position: absolute; left: 72px; top: 662px; color: #F2F4F7;
    font-family: Plex, monospace; font-weight: 500; font-size: 48px;
    letter-spacing: 0; font-variant-numeric: tabular-nums; line-height: 1;
  }
</style>
</head>

<div id="stage">
  <canvas id="view"></canvas>

  <div id="foot"></div>
  <div id="type">

    <div id="hook2" class="hook"></div>
    <div id="term" class="term"></div>
    <div id="sub" class="sub"></div>
    <div id="hud" class="hud">СХЕМА</div>
    <div id="gap" class="gap"></div>
  </div>
</div>
